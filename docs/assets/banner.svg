<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <title>Network Trace: continuous traceroute monitoring with reports for your ISP</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16213a"/>
      <stop offset="1" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#62e0b8"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#4f8cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#62e0b8" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>

  <!-- A latency timeline running behind everything, with a burst of packet loss -->
  <g transform="translate(0 0)">
    <path d="M0 300 L60 298 L120 301 L180 297 L240 300 L300 299 L360 302 L420 298 L480 300 L540 297 L600 300 L660 299 L720 301 L760 300 L780 262 L800 270 L820 252 L840 266 L860 248 L880 262 L900 256 L920 270 L940 299 L1000 301 L1060 298 L1120 300 L1180 299 L1280 300 L1280 360 L0 360 Z" fill="url(#fade)"/>
    <path d="M0 300 L60 298 L120 301 L180 297 L240 300 L300 299 L360 302 L420 298 L480 300 L540 297 L600 300 L660 299 L720 301 L760 300 L780 262 L800 270 L820 252 L840 266 L860 248 L880 262 L900 256 L920 270 L940 299 L1000 301 L1060 298 L1120 300 L1180 299 L1280 300" fill="none" stroke="url(#trace)" stroke-width="3" stroke-linejoin="round"/>
    <g fill="#ff6b5e" opacity="0.8">
      <rect x="782" y="330" width="6" height="14" rx="1"/>
      <rect x="796" y="322" width="6" height="22" rx="1"/>
      <rect x="810" y="334" width="6" height="10" rx="1"/>
      <rect x="824" y="318" width="6" height="26" rx="1"/>
      <rect x="838" y="326" width="6" height="18" rx="1"/>
      <rect x="852" y="314" width="6" height="30" rx="1"/>
      <rect x="866" y="328" width="6" height="16" rx="1"/>
      <rect x="880" y="320" width="6" height="24" rx="1"/>
      <rect x="894" y="332" width="6" height="12" rx="1"/>
      <rect x="908" y="326" width="6" height="18" rx="1"/>
      <rect x="922" y="336" width="6" height="8" rx="1"/>
    </g>
  </g>

  <!-- Logo mark -->
  <g transform="translate(88 60) scale(0.8)">
    <rect width="256" height="256" rx="56" fill="#0b1020" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
    <path d="M52 196 L96 150 L132 168 L170 104 L204 72" fill="none" stroke="url(#route)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="52" cy="196" r="14" fill="#4f8cff"/>
    <circle cx="96" cy="150" r="10" fill="#0b1020" stroke="#5a98ff" stroke-width="7"/>
    <circle cx="132" cy="168" r="10" fill="#0b1020" stroke="#58b2e6" stroke-width="7"/>
    <circle cx="170" cy="104" r="10" fill="#0b1020" stroke="#5cc9cf" stroke-width="7"/>
    <circle cx="204" cy="72" r="16" fill="#62e0b8"/>
    <path d="M226 50 A31 31 0 0 1 226 94" fill="none" stroke="#62e0b8" stroke-width="6" stroke-linecap="round" opacity="0.55" transform="rotate(-45 204 72)"/>
    <path d="M236 40 A45 45 0 0 1 236 104" fill="none" stroke="#62e0b8" stroke-width="6" stroke-linecap="round" opacity="0.25" transform="rotate(-45 204 72)"/>
  </g>

  <!-- Wordmark and tagline -->
  <g font-family="'Segoe UI', 'Inter', 'Noto Sans', 'Helvetica Neue', Arial, sans-serif">
    <text x="344" y="150" font-size="76" font-weight="700" fill="#f3f6fc" letter-spacing="-1">Network Trace</text>
    <text x="348" y="200" font-size="27" fill="#aab6cc">See where your connection breaks, and prove it to your ISP.</text>
    <g font-size="18" fill="#7f8ba3">
      <text x="348" y="240">Continuous traceroute · per-hop loss &amp; latency · PDF/CSV reports · Linux &amp; Windows</text>
    </g>
  </g>
</svg>
