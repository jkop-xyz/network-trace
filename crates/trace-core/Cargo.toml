[package]
name = "trace-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dns-lookup = "4.0.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync", "macros", "net"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"
