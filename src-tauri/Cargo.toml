[package]
name = "network-trace"
version = "0.1.0-beta.5"
description = "Continuous traceroute monitoring with reports for your ISP"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "network_trace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.4"
tokio = { version = "1.54.1", features = ["sync", "time", "net", "macros"] }
anyhow = "1.0.104"
ureq = { version = "3.5.2", features = ["json"] }
trace-core = { version = "0.1.0", path = "../crates/trace-core" }
tauri-plugin-single-instance = "2.5.5"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"


