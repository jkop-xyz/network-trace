name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04's older glibc lets the AppImage run on more distros.
          - os: ubuntu-22.04
            artifact: network-trace-linux-x86_64.AppImage
          - os: windows-latest
            artifact: network-trace-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          # Allow unprivileged ICMP for the probe tests.
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Type-check the UI
        run: npm run check

      - name: Core tests
        run: cargo test -p trace-core

      - name: Build AppImage
        if: runner.os == 'Linux'
        run: |
          npx tauri build --bundles appimage
          cp target/release/bundle/appimage/*.AppImage ${{ matrix.artifact }}

      - name: Build portable exe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npx tauri build --no-bundle
          cp target/release/network-trace.exe ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # Tags like v0.1.0-beta.1 become pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
